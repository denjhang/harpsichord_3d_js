<script type="module">
import * as THREE from "three";
import { Line2 } from "three/addons/lines/Line2.js";
import { LineGeometry } from "three/addons/lines/LineGeometry.js";
import { LineMaterial } from "three/addons/lines/LineMaterial.js";

/* ============ 音频：Karplus-Strong 拨弦物理合成 ============ */
let AC=null, master=null;
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.9;
  const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=5200; lp.Q.value=.6; // 木箱体
  const hs=AC.createBiquadFilter(); hs.type="highshelf"; hs.frequency.value=1800; hs.gain.value=-6;
  master.connect(lp); lp.connect(hs); hs.connect(AC.destination);
}
function synthPluck(freq, vel){                       // Karplus-Strong
  initAudio(); if(AC.state==="suspended")AC.resume();
  const sr=AC.sampleRate, N=Math.max(2,Math.round(sr/freq));
  const dur=Math.min(3.2,1.6+220/freq);
  const buf=AC.createBuffer(1,Math.ceil(sr*dur),sr), d=buf.getChannelData(0);
  const ring=new Float32Array(N);
  for(let i=0;i<N;i++) ring[i]=(Math.random()*2-1)*.9;
  let last=0; const damp=.5+.493*Math.exp(-freq/1800);
  for(let i=0;i<d.length;i++){
    const j=i%N, cur=ring[j];
    d[i]=cur; ring[j]=damp*(cur+ring[(j+1)%N])/2+last*.02; last=cur;
  }
  for(let i=0;i<Math.floor(N/5)&&i<d.length;i++) d[i]*=i/Math.floor(N/5); // 1/5 拨弦点谐波
  const src=AC.createBufferSource(); src.buffer=buf;
  const g=AC.createGain(); g.gain.value=.32*vel;
  src.connect(g); g.connect(master); src.start();
}

/* ============ 场景 ============ */
const canvas=document.getElementById("c3d");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdfe1e4);
scene.fog=new THREE.Fog(0xdfe1e4,140,420);
const camera=new THREE.PerspectiveCamera(42,1,.1,500);

{ // 灯光（浅色工作区：高环境光 + 柔和主光）
  scene.add(new THREE.AmbientLight(0xffffff,.8));
  const key=new THREE.DirectionalLight(0xffffff,1.6); key.position.set(18,30,35); scene.add(key);
  const rim=new THREE.DirectionalLight(0xdde4ee,.5); rim.position.set(-25,10,-20); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xf0f2f5,0x9a938a,.5));
}

/* ---- 琴体轮廓（单位 cm，参考实物：全长32.5 厚2.8 顶部闭合）---- */
const NOTES=[261.63,293.66,329.63,392.00,440.00,523.25,587.33];
const KEYMAP={a:0,s:1,d:2,f:3,g:4,h:5,j:6,"1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"7":6};
const GAP=1.55, X0=-(NOTES.length-1)/2*GAP;
const H=32.5, TH=2.8;
/* 打印热床 250×250mm：整体等比缩放到最长边 240mm（留对齐边距），后续 STL 导出沿用同一 SCALE */
const BED=25;                                          // 热床边长(cm)
const SCALE=24.0/H;                                    // 240mm / 325mm ≈ 0.7385
document.getElementById("sc").textContent="1:"+(1/SCALE).toFixed(2);
const shape=new THREE.Shape();
shape.moveTo(0,.6);
shape.bezierCurveTo( 3.2,.6, 6.4,1.6, 8.2,3.6);      // 底部右弧
shape.bezierCurveTo(10.6,6.4, 10.9,10.8, 8.9,14.2);  // 右下鼓肚
shape.bezierCurveTo(7.6,16.4, 6.3,17.6, 6.1,19.6);   // 右腰
shape.bezierCurveTo(5.9,22.4, 7.3,24.4, 7.8,27.0);   // 右上鼓
shape.bezierCurveTo(8.2,29.6, 7.4,31.2, 5.4,31.9);   // 右肩
shape.bezierCurveTo(3.6,32.5, -3.6,32.5, -5.4,31.9); // 顶部闭合横梁
shape.bezierCurveTo(-7.4,31.2, -8.2,29.6, -7.8,27.0);// 左肩
shape.bezierCurveTo(-7.3,24.4, -5.9,22.4, -6.1,19.6);// 左上鼓
shape.bezierCurveTo(-6.3,17.6, -7.6,16.4, -8.9,14.2);// 左腰
shape.bezierCurveTo(-10.9,10.8, -10.6,6.4, -8.2,3.6);// 左下鼓肚
shape.bezierCurveTo(-6.4,1.6, -3.2,.6, 0,.6);
shape.closePath();
// 弦窗（大椭圆镂空，顶部保留闭合横梁）
const win=new THREE.Path();
win.absellipse(0,22.6, 4.6,6.4, 0,Math.PI*2,true);
shape.holes.push(win);
// 圆音孔
const sndHole=new THREE.Path();
sndHole.absellipse(0,8.6, 2.5,2.5, 0,Math.PI*2,true);
shape.holes.push(sndHole);
// 下端 7 个穿弦孔（弦穿过板到背面固定）
for(let i=0;i<7;i++){
  const hp=new THREE.Path();
  hp.absellipse(X0+i*GAP,2.5,.3,.3,0,Math.PI*2,true);
  shape.holes.push(hp);
}

/* 木纹贴图（程序生成） */
function woodTexture(base="#e8cfa0",dark="#b98f58"){
  const c=document.createElement("canvas"); c.width=512;c.height=1024;
  const g=c.getContext("2d");
  g.fillStyle=base; g.fillRect(0,0,512,1024);
  for(let i=0;i<90;i++){                                // 纵向木纹
    g.strokeStyle=`rgba(120,80,30,${.04+Math.random()*.08})`;
    g.lineWidth=.6+Math.random()*2.2;
    const x=Math.random()*512;
    g.beginPath(); g.moveTo(x,0);
    for(let y=0;y<=1024;y+=64) g.lineTo(x+Math.sin(y*.01+i)*9+(Math.random()-.5)*6,y);
    g.stroke();
  }
  for(let i=0;i<14;i++){                                // 淡色年轮晕
    g.fillStyle=`rgba(255,240,200,${.03+Math.random()*.04})`;
    g.beginPath(); g.ellipse(Math.random()*512,Math.random()*1024,30+Math.random()*70,80+Math.random()*160,0,0,7); g.fill();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const bodyMat=new THREE.MeshStandardMaterial({map:woodTexture(),roughness:.72,metalness:.02});
const body=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:TH,bevelEnabled:true,bevelThickness:.22,bevelSize:.22,bevelSegments:3,curveSegments:48}),bodyMat);
body.geometry.center();                                // 居中，方便绕琴体旋转
const BODY=new THREE.Group(); BODY.add(body); scene.add(BODY);
// 坐标换算：轮廓 y(0..32.5) → 世界 y(-16.25..16.25)；厚 2.8 → z ±1.4
const cm=v=>v-H/2;
/* 缩放到打印比例并落在热床面上（床面=世界 y=0） */
BODY.scale.setScalar(SCALE);
BODY.position.y=H/2*SCALE;
const BODY_TOP=H*SCALE;                                // 缩放后琴体总高(cm) ≈ 24

/* ---- 弦 ---- */
const STR_TOP=31.0;                                    // 弦上端：缠绕在音柱上
const STR_BOT=4.0;                                     // 弦振动段下端：架在品条上
const STR_Z=TH/2+1.05;                                 // 弦平面悬空于面板前 1.05cm
const strings=[];
const SEG=36, TAIL=4;                                  // 振动段 + 穿板尾段
const PEG_Y=31.3;                                      // 音柱中心（轮廓坐标）
const THICK=[.16,.14,.12,.105,.09,.075,.06];           // 弦径(cm)：低粗高细，明显区分
for(let i=0;i<7;i++){
  const geo=new LineGeometry();
  const mat=new LineMaterial({color:0xf2efe6,worldUnits:true,linewidth:THICK[i]});
  const line=new Line2(geo,mat);
  const x=X0+i*GAP;
  const grp=new THREE.Group(); grp.position.x=x; grp.add(line);
  BODY.add(grp);
  // 视觉驻波衰减时间常数：低音弦振得久、高音弦收得快（与音频延音一致）
  strings.push({grp,line,x,note:NOTES[i],amp:0,phase:0,lastPluck:-1e9,freq:NOTES[i],
                ring:1.2+1.2*Math.exp(-(NOTES[i]-261)/230)});
}
// 背面固定环（铁扣）：弦穿过板后在背面锁住，有体积感
const ringMat=new THREE.MeshStandardMaterial({color:0xc8c8d2,roughness:.3,metalness:.95});
const RING_Z=-TH/2-.55;
for(let i=0;i<7;i++){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.55,.16,12,24),ringMat);
  ring.position.set(X0+i*GAP,cm(2.5),RING_Z); BODY.add(ring);
  const knot=new THREE.Mesh(new THREE.SphereGeometry(.2,10,8),ringMat); // 弦端结扣
  knot.position.set(X0+i*GAP,cm(2.5),RING_Z-.2); BODY.add(knot);
}
// 下端品条：唯一的木条，立起支撑琴弦（弦锚点在背面穿孔+铁扣）
const nutMat=new THREE.MeshStandardMaterial({color:0x7a5a30,roughness:.6});
const bridge=new THREE.Mesh(new THREE.BoxGeometry(GAP*6+1.8,1.2,1.0),nutMat);
bridge.position.set(0,cm(4.1),TH/2+.35); BODY.add(bridge);   // 顶面托住弦
// 上端音柱（无横木）：金属柱体从横梁前表面伸出，弦缠绕其上
const pegMat=new THREE.MeshStandardMaterial({color:0xd8d8de,roughness:.25,metalness:.9});
const pegs=[];
for(let i=0;i<7;i++){
  const grp=new THREE.Group();
  const peg=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,1.3,14),pegMat);
  peg.rotation.x=Math.PI/2; grp.add(peg);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.18,14),pegMat);
  cap.rotation.x=Math.PI/2; cap.position.z=.75; grp.add(cap);   // 柱头防脱
  grp.position.set(X0+i*GAP,cm(PEG_Y),TH/2+.55);
  BODY.add(grp);
  pegs.push(grp);
}

/* ============ 打印热床托盘（仿切片软件 250×250 纹理PEI板）============ */
function bedTexture(){
  const S=1250, px=S/BED;                               // 50px/cm：1cm 网格清晰
  const c=document.createElement("canvas"); c.width=S; c.height=S;
  const g=c.getContext("2d");
  g.fillStyle="#3a3f44"; g.fillRect(0,0,S,S);           // 深灰 PEI 底
  for(let i=0;i<2600;i++){                              // 喷砂纹理噪点
    g.fillStyle=`rgba(${190+Math.random()*60|0},${195+Math.random()*60|0},${205+Math.random()*60|0},${Math.random()*.06})`;
    g.fillRect(Math.random()*S,Math.random()*S,1.5,1.5);
  }
  const cx=S/2;
  for(let i=-12;i<=12;i++){                             // 网格：1cm 一格，5cm 加粗（步距=1cm=px）
    const p=cx+i*px, major=i%5===0;
    g.strokeStyle=major?"rgba(215,222,230,.65)":"rgba(205,212,220,.32)";
    g.lineWidth=major?3:1.5;
    g.beginPath();g.moveTo(p,0);g.lineTo(p,S);g.stroke();
    g.beginPath();g.moveTo(0,p);g.lineTo(S,p);g.stroke();
  }
  g.strokeStyle="rgba(230,235,240,.75)"; g.lineWidth=5; // 外边框
  g.strokeRect(3,3,S-6,S-6);
  g.strokeStyle="rgba(230,235,240,.45)"; g.lineWidth=2.5;
  for(const [mx,my] of [[46,46],[S-46,46],[46,S-46],[S-46,S-46]]){ // 四角 L 形标
    g.beginPath();g.moveTo(mx+(mx<cx?30:-30),my);g.lineTo(mx,my);g.lineTo(mx,my+(my<cx?30:-30));g.stroke();
  }
  // 原点(前左角) RGB 坐标轴（切片软件风格：X红 Y绿 Z蓝）
  const ox=64, oy=S-64;
  g.lineWidth=6; g.lineCap="round";
  g.strokeStyle="#e0392b"; g.beginPath();g.moveTo(ox,oy);g.lineTo(ox+88,oy);g.stroke();       // X→
  g.beginPath();g.moveTo(ox+88,oy);g.lineTo(ox+70,oy-9);g.moveTo(ox+88,oy);g.lineTo(ox+70,oy+9);g.stroke();
  g.strokeStyle="#37b24d"; g.beginPath();g.moveTo(ox,oy);g.lineTo(ox,oy-88);g.stroke();       // Y↑
  g.beginPath();g.moveTo(ox,oy-88);g.lineTo(ox-9,oy-70);g.moveTo(ox,oy-88);g.lineTo(ox+9,oy-70);g.stroke();
  g.strokeStyle="#3b6fe0"; g.beginPath();g.moveTo(ox,oy);g.lineTo(ox-46,oy+46);g.stroke();    // Z(斜向示意)
  g.lineCap="butt";
  // 前缘白色标牌条
  g.fillStyle="rgba(245,246,248,.92)";
  g.beginPath(); g.roundRect(S*.5-330,S-138,660,58,26); g.fill();
  g.fillStyle="#33373c"; g.font="bold 34px Georgia"; g.textAlign="center";
  g.fillText("LYRE · 250 × 250 mm · PLA/ABS/PETG",S/2,S-96);
  // 右下角绿色序号（切片软件排板样式）
  g.fillStyle="#1fae52"; g.font="italic bold 72px Georgia"; g.textAlign="left";
  g.fillText("01",S-210,S-120);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
{
  const plate=new THREE.Mesh(
    new THREE.BoxGeometry(BED,0.4,BED),
    [0,1,2,3,4,5].map(i=>i===2                             // +Y 面贴网格纹理，其余深色侧面
      ? new THREE.MeshStandardMaterial({map:bedTexture(),roughness:.85,metalness:.1})
      : new THREE.MeshStandardMaterial({color:0x2c3034,roughness:.7})));
  plate.position.y=-0.2; scene.add(plate);                // 床面顶=世界 y0
  // 床面落影（切片软件风格淡影）
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(1,32),
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.12}));
  shadow.rotation.x=-Math.PI/2; shadow.position.y=0.02;
  shadow.scale.set(9.5,BODY_TOP/2.4,1); scene.add(shadow);
}

/* ============ 自由视角（操作对齐 FreeCAD）============ */
const target=new THREE.Vector3(0,BODY_TOP/4,0);        // 默认中心=热床面与物体中心的中点
let yaw=.7, pitch=.5, roll=0, dist=58;                 // 初始轴测
function fitView(){                                    // 自动适应窗口：床+琴体整体可见
  const fV=camera.fov*Math.PI/180;
  const fH=2*Math.atan(Math.tan(fV/2)*camera.aspect);
  const rad=Math.max(BED/2, BODY_TOP);                 // 立起物全高比床半宽大，取大者
  dist=(rad*1.18)/Math.tan(Math.min(fV,fH)/2);
}
function applyCam(){
  pitch=Math.max(-1.45,Math.min(1.45,pitch));
  camera.position.set(
    target.x+dist*Math.cos(pitch)*Math.sin(yaw),
    target.y+dist*Math.sin(pitch),
    target.z+dist*Math.cos(pitch)*Math.cos(yaw));
  camera.up.set(Math.sin(roll),Math.cos(roll),0);      // roll=绕视线滚转（弯箭头）
  camera.lookAt(target);
}
let mode=null,px=0,py=0;
canvas.addEventListener("pointerdown",e=>{
  mode=e.shiftKey?"pan":"rot"; px=e.clientX; py=e.clientY;
  canvas.classList.add("dragging"); canvas.setPointerCapture(e.pointerId);
  if(!e.shiftKey) tryPluckRay(e);
});
canvas.addEventListener("pointermove",e=>{
  const dx=e.clientX-px, dy=e.clientY-py;
  if(mode==="rot"){ yaw-=dx*.006; pitch+=dy*.006; applyCam(); }
  else if(mode==="pan"){
    const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    target.addScaledVector(right,-dx*dist*.0011).addScaledVector(up,dy*dist*.0011);
    applyCam();
  } else if(mode==="pluck"){ sweepPluck(e.clientX,e.clientY); }
  px=e.clientX; py=e.clientY;
});
window.addEventListener("pointerup",()=>{mode=null;canvas.classList.remove("dragging");});
canvas.addEventListener("wheel",e=>{e.preventDefault();dist*=Math.pow(1.0011,e.deltaY);dist=Math.max(15,Math.min(160,dist));applyCam();},{passive:false});

/* ---- 拨弦：射线拾取 ---- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function toNDC(x,y){const r=canvas.getBoundingClientRect();ndc.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1);}
function pluckSt(st,vel=1){
  const now=performance.now();
  if(now-st.lastPluck<60)return;
  st.lastPluck=now; st.phase=Math.random()*6.28; st.freq=st.note;
  st.amp=.06; synthPluck(st.freq,vel);
}
function tryPluckRay(e){
  toNDC(e.clientX,e.clientY); ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(strings.map(s=>s.line),false)[0];
  if(hit){const st=strings.find(s=>s.line===hit.object); if(st)pluckSt(st);}
}
function sweepPluck(x,y){                               // 扫弦：屏幕 x 跨过的弦全拨
  toNDC(x,y); ray.setFromCamera(ndc,camera);
  const plane=new THREE.Plane(new THREE.Vector3(0,0,1),-STR_Z);       // 弦所在平面
  const p=new THREE.Vector3();
  if(ray.ray.intersectPlane(plane,p)){
    const lx=BODY.worldToLocal(p.clone()).x;
    for(const st of strings) if(Math.abs(lx-st.x)<GAP*.55) pluckSt(st,.9);
  }
}
window.addEventListener("keydown",e=>{
  const i=KEYMAP[e.key.toLowerCase()];
  if(i!==undefined) pluckSt(strings[i]);
});

/* ============ 导航立方体（仿 FreeCAD：圆角六面可点击 + 环绕箭头 + 滚转弯箭头 + 小立方切换轴十字）============ */
const cubeCv=document.getElementById("cube"), cg=cubeCv.getContext("2d");
let widgetMode="cube";                                  // cube | axes
const hitItems=[];                                      // 每帧重建：{path, act, tip}
// 每面：法线、切向轴 u/v、底色、标签、点击后的目标视角(yaw,pitch)
const FACES=[
  {n:[0,0, 1],u:[1,0,0], v:[0,1,0], col:"#d9cdb4", l:"前", v0:0,        p0:0},
  {n:[0,0,-1],u:[-1,0,0],v:[0,1,0], col:"#c4b8a0", l:"后", v0:Math.PI,  p0:0},
  {n:[1,0, 0],u:[0,0,-1],v:[0,1,0], col:"#cfc3aa", l:"右", v0:-Math.PI/2,p0:0},
  {n:[-1,0,0],u:[0,0,1], v:[0,1,0], col:"#bfb39a", l:"左", v0:Math.PI/2, p0:0},
  {n:[0,1, 0],u:[1,0,0], v:[0,0,-1],col:"#e6dcc6", l:"上", v0:0,        p0:Math.PI/2},
  {n:[0,-1,0],u:[1,0,0], v:[0,0,1], col:"#b3a78f", l:"下", v0:0,        p0:-Math.PI/2},
];
function cubeRot(v){                                    // 与主相机一致的旋转
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const x=v[0]*cy+v[2]*sy, z0=-v[0]*sy+v[2]*cy, y0=v[1];
  return [x, y0*cp-z0*sp, y0*sp+z0*cp];
}
const D2R=Math.PI/180;
function roundedPoly(pts,rad){                          // 圆角多边形（模拟棱边曲面）
  const p=new Path2D(), n=pts.length;
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  for(let i=0;i<n;i++){
    const prev=pts[(i-1+n)%n], cur=pts[i], next=pts[(i+1)%n];
    const l1=dist(cur,prev), l2=dist(next,cur);
    const r=Math.min(rad,l1/2.2,l2/2.2);
    const ux=(cur[0]-prev[0])/l1, uy=(cur[1]-prev[1])/l1;
    const wx=(next[0]-cur[0])/l2, wy=(next[1]-cur[1])/l2;
    const ax=cur[0]-ux*r, ay=cur[1]-uy*r, bx=cur[0]+wx*r, by=cur[1]+wy*r;
    if(i===0) p.moveTo(ax,ay); else p.lineTo(ax,ay);
    p.quadraticCurveTo(cur[0],cur[1],bx,by);            // 角部二次曲线=圆滑棱边
  }
  p.closePath(); return p;
}
function triPath(x,y,dir,s){                            // 环绕三角箭头 dir:0上1右2下3左
  const d=[[0,-1],[1,0],[0,1],[-1,0]][dir];
  const p1=[x-d[1]*s, y+d[0]*s], p2=[x+d[1]*s, y-d[0]*s], tip=[x+d[0]*s*1.5, y+d[1]*s*1.5];
  const p=new Path2D(); p.moveTo(...p1); p.lineTo(...p2); p.lineTo(...tip); p.closePath(); return p;
}
function drawCube(){
  const S=264, c=S/2;
  cg.clearRect(0,0,S,S);
  hitItems.length=0;
  const reg=(path,act,tip="")=>hitItems.push({path,act,tip});
  // 背景
  cg.fillStyle="rgba(250,250,250,.75)"; cg.beginPath(); cg.arc(c,c,116,0,7); cg.fill();
  cg.strokeStyle="rgba(90,85,78,.35)"; cg.lineWidth=2; cg.stroke();
  const proj=r=>[c+r[0]*80, c-r[1]*80];
  if(widgetMode==="cube"){
    // 真·倒角立方体：面收缩，12条双面棱与8个三面角处画独立倒角块（可点击切过渡视角）
    const h=.76, sk=.68, rad=16;                        // sk=面收缩比例，露出的空隙由倒角块填
    const mixHex=(a,b)=>{                               // 两面颜色混出倒角色
      const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
      const m=i=>Math.round(((pa>>i&255)+(pb>>i&255))/2);
      return "#"+[16,8,0].map(i=>m(i).toString(16).padStart(2,"0")).join("");
    };
    const dirOf=(yaw,pitch)=>[Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch),Math.cos(pitch)*Math.cos(yaw)];
    const viewOf=dirs=>{                                // 若干方向平均→目标yaw/pitch
      const v=dirs.reduce((a,d)=>[a[0]+d[0],a[1]+d[1],a[2]+d[2]],[0,0,0]);
      return [Math.atan2(v[0],v[2]), Math.asin(v[1]/Math.hypot(...v))];
    };
    const p3=(f,su,sv,k)=>cubeRot([(f.n[0]+f.u[0]*su+f.v[0]*sv)*h*k,
                                   (f.n[1]+f.u[1]*su+f.v[1]*sv)*h*k,
                                   (f.n[2]+f.u[2]*su+f.v[2]*sv)*h*k]);
    const keyOf=(f,su,sv)=>p3(f,su,sv,1).map(v=>v.toFixed(2)).join("|");
    const vis=FACES.map(f=>({f,rn:cubeRot(f.n)}))
                   .filter(o=>o.rn[2]>.02).sort((a,b)=>a.rn[2]-b.rn[2]);
    // 倒角块画在面之前？不：先画面，再画倒角块盖住交界缝
    const ctrOf=f=>proj(cubeRot(f.n.map(v=>v*h)));
    for(const {f,rn} of vis){
      const pts=[p3(f,-1,-1,sk),p3(f,1,-1,sk),p3(f,1,1,sk),p3(f,-1,1,sk)].map(proj);
      const path=roundedPoly(pts,rad);
      cg.fillStyle=f.col; cg.globalAlpha=.6+.4*rn[2]; cg.fill(path); cg.globalAlpha=1;
      cg.strokeStyle="#6a645c"; cg.lineWidth=1.4; cg.stroke(path);
      const ctrp=ctrOf(f), tp=[ctrp[0]+(ctrp[0]-c)*.25, ctrp[1]+(ctrp[1]-c)*.25];
      cg.fillStyle="#4a453e"; cg.font="bold 19px Georgia";
      cg.textAlign="center"; cg.textBaseline="middle";
      cg.fillText(f.l,tp[0],tp[1]);
      reg(path,()=>animCam(f.v0,f.p0,0),"面:"+f.l);      // 点击面→该面正交视角
    }
    // 双面倒角（可见面对的共享棱，可见时最多3条；全立方共12条棱）
    for(let i=0;i<vis.length;i++)for(let j=i+1;j<vis.length;j++){
      const A=vis[i].f, B=vis[j].f, sa=[], sb=[];
      for(const su of[-1,1])for(const sv of[-1,1]){
        const k=keyOf(A,su,sv);
        for(const u of[-1,1])for(const v of[-1,1])
          if(keyOf(B,u,v)===k){ sa.push([su,sv]); sb.push([u,v]); }
      }
      if(sa.length!==2) continue;
      const q=[p3(A,...sa[0],sk),p3(A,...sa[1],sk),p3(B,...sb[1],sk),p3(B,...sb[0],sk)].map(proj);
      const strip=roundedPoly(q,14);                    // 大倒角条
      cg.fillStyle=mixHex(A.col,B.col); cg.fill(strip);
      cg.strokeStyle="#6a645c"; cg.lineWidth=1.2; cg.stroke(strip);
      const [ty,tp2]=viewOf([dirOf(A.v0,A.p0),dirOf(B.v0,B.p0)]);
      const mid=[(q[0][0]+q[1][0]+q[2][0]+q[3][0])/4,(q[0][1]+q[1][1]+q[2][1]+q[3][1])/4];
      const hot=new Path2D(); hot.arc(mid[0],mid[1],30,0,7);   // 放大热区：条带中点大圆
      reg(hot,()=>animCam(ty,tp2,0),"棱:"+A.l+B.l);      // 点击棱→两面之间的对角视角
      reg(strip,()=>animCam(ty,tp2,0));
    }
    // 三面角倒角（三面共同顶点；全立方共8个）
    if(vis.length===3){
      const [A,B,C]=vis.map(o=>o.f);
      const pts=[];
      { // 公共顶点在三个面里的局部坐标各不相同 → 按全局键求交集
        const loc=f=>{const m={};for(const su of[-1,1])for(const sv of[-1,1])m[keyOf(f,su,sv)]=[su,sv];return m;};
        const mA=loc(A),mB=loc(B),mC=loc(C);
        for(const k in mA) if(mB[k]&&mC[k]){
          pts.push(proj(p3(A,...mA[k],sk)),proj(p3(B,...mB[k],sk)),proj(p3(C,...mC[k],sk)));
          break;
        }
      }
      if(pts.length===3){
        const tri=roundedPoly(pts,14);
        cg.fillStyle=mixHex(mixHex(A.col,B.col),C.col); cg.fill(tri);
        cg.strokeStyle="#6a645c"; cg.lineWidth=1.2; cg.stroke(tri);
        const [ty,tp2]=viewOf([A,B,C].map(f=>dirOf(f.v0,f.p0)));
        const g2=[(pts[0][0]+pts[1][0]+pts[2][0])/3,(pts[0][1]+pts[1][1]+pts[2][1])/3];
        const hot2=new Path2D(); hot2.arc(g2[0],g2[1],34,0,7);   // 放大热区：重心大圆
        reg(hot2,()=>animCam(ty,tp2,0),"角:"+A.l+B.l+C.l);// 点击角→轴测视角
        reg(tri,()=>animCam(ty,tp2,0));
      }
    }
  } else {                                              // 轴十字（小立方切换）
    for(const [ax,col,l] of [[[1,0,0],"#e0392b","X"],[[0,1,0],"#37b24d","Y"],[[0,0,1],"#3b6fe0","Z"]]){
      const r=cubeRot(ax), [ex,ey]=proj([r[0]*1.15,-r[1]*1.15]);
      cg.strokeStyle=col; cg.lineWidth=5; cg.lineCap="round";
      cg.beginPath(); cg.moveTo(c,c); cg.lineTo(ex,ey); cg.stroke();
      cg.fillStyle=col; cg.font="bold 15px Georgia"; cg.textAlign="center"; cg.textBaseline="middle";
      cg.fillText(l,ex*1.12-c*.12,ey*1.12-c*.12);
    }
    cg.lineCap="butt";
  }
  // 四个环绕三角箭头：上下左右平转/俯仰视角
  const A=102;
  const arrows=[
    [c,  c-A, 0, ()=>animCam(yaw,           Math.min(1.45,pitch+45*D2R), roll)], // ↑抬头
    [c,  c+A, 2, ()=>animCam(yaw,           Math.max(-1.45,pitch-45*D2R), roll)], // ↓低头
    [c-A,c,   3, ()=>animCam(yaw+45*D2R,    pitch, roll)],                      // ←左环绕
    [c+A,c,   1, ()=>animCam(yaw-45*D2R,    pitch, roll)],                      // →右环绕
  ];
  for(const [x,y,d,act] of arrows){
    const p=triPath(x,y,d,12);
    cg.fillStyle="rgba(120,112,102,.55)"; cg.fill(p);
    reg(p,act,"箭头"+d);
  }
  // 左上/右上弯曲箭头：绕视线滚转物体（数学坐标 y向上，角度制）
  const bend=(cx2,cy2,a0,a1,act)=>{
    const r=23, pt=t=>{const q=t*D2R; return [cx2+Math.cos(q)*r, cy2-Math.sin(q)*r];};
    const p=new Path2D(); p.moveTo(...pt(a0));
    for(let i=1;i<=16;i++) p.lineTo(...pt(a0+(a1-a0)*i/16));
    cg.strokeStyle="rgba(120,112,102,.6)"; cg.lineWidth=5; cg.lineCap="round"; cg.stroke(p);
    cg.lineCap="butt";
    const sgn=(a1>a0?1:-1), tq=a1*D2R;
    const tx=-Math.sin(tq)*sgn, ty=-Math.cos(tq)*sgn;   // 末端运动切向
    const [ex,ey]=pt(a1);
    const hp=new Path2D();
    hp.moveTo(ex+tx*9,ey+ty*9);                          // 三角箭头
    hp.lineTo(ex-tx*3-ty*5,ey-ty*3+tx*5);
    hp.lineTo(ex-tx*3+ty*5,ey-ty*3-tx*5);
    hp.closePath();
    cg.fillStyle="rgba(120,112,102,.6)"; cg.fill(hp);
    const hit=new Path2D(); hit.arc(cx2,cy2,26,0,7);     // 加大命中区
    reg(hit,act,"弯箭头");
  };
  bend(c-66,c-66, 180, 90, ()=>animCam(yaw,pitch,roll+30*D2R));  // 左上：逆时针滚转
  bend(c+66,c-66, 0,   90, ()=>animCam(yaw,pitch,roll-30*D2R));  // 右上：顺时针滚转
  // 右下角小立方体：切换 立方体/轴十字（FreeCAD 同款功能）
  const mini=new Path2D(); mini.rect(212,212,40,40);
  cg.fillStyle="rgba(250,250,250,.8)"; cg.fill(mini);
  cg.strokeStyle="rgba(90,85,78,.4)"; cg.lineWidth=1.5; cg.stroke(mini);
  const mx2=232,my2=232,s2=9;                           // 迷你等轴立方
  const iso=(x,y,z)=>[mx2+(x-z)*s2*.9, my2-(y*1.1-(x+z)*.45)*s2];
  for(const [pts,col] of [
    [[iso(-1,1,-1),iso(1,1,-1),iso(1,1,1),iso(-1,1,1)],"#cfc3aa"],      // 顶
    [[iso(-1,-1,1),iso(1,-1,1),iso(1,1,1),iso(-1,1,1)],"#b3a78f"],      // 前
    [[iso(1,-1,1),iso(1,-1,-1),iso(1,1,-1),iso(1,1,1)],"#c4b8a0"],      // 右
  ]){
    const mp=roundedPoly(pts.map(q=>[q[0],q[1]]),3);    // 小立方同样倒角
    cg.fillStyle=col; cg.fill(mp); cg.strokeStyle="#6a645c"; cg.lineWidth=1; cg.stroke(mp);
  }
  reg(mini,()=>{widgetMode=widgetMode==="cube"?"axes":"cube";},"小立方");
}
// 命中测试（坐标×2：canvas 220 / CSS 110）
function cubeHit(e){
  const r=cubeCv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*2, y:(e.clientY-r.top)*2};
}
// 调试接口：命中查询 / 当前视角
window.__cubeHitAt=(x,y)=>{if(!hitItems.length)drawCube();const i=hitItems.findIndex(it=>cg.isPointInPath(it.path,x,y));return i<0?null:hitItems[i].tip;};
window.__view=()=>({yaw:+(yaw*180/Math.PI).toFixed(1),pitch:+(pitch*180/Math.PI).toFixed(1),roll:+(roll*180/Math.PI).toFixed(1)});
window.__hitInfo=()=>({n:hitItems.length, tips:hitItems.map(i=>i.tip), mode:widgetMode, frame:performance.now()});
cubeCv.addEventListener("click",e=>{
  const {x,y}=cubeHit(e);
  if(!hitItems.length) drawCube();                     // rAF 被节流时也能命中
  for(let i=hitItems.length-1;i>=0;i--)
    if(cg.isPointInPath(hitItems[i].path,x,y)){ hitItems[i].act(); return; }
});
cubeCv.addEventListener("pointermove",e=>{
  const {x,y}=cubeHit(e);
  if(!hitItems.length) drawCube();
  cubeCv.style.cursor=hitItems.some(it=>cg.isPointInPath(it.path,x,y))?"pointer":"default";
});
let camAnim=null;
function animCam(ty,tp,tr=roll){
  const s={yaw,pitch,roll,dist};
  const dYaw=((ty-s.yaw+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  let dRoll=((tr-s.roll+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  camAnim={t0:performance.now(),dur:450,s,dYaw,tp:tp-s.pitch,dRoll};
}
function stepCube(t){
  if(camAnim){
    const k=Math.min(1,(t-camAnim.t0)/camAnim.dur), e=1-Math.pow(1-k,3);
    yaw=camAnim.s.yaw+camAnim.dYaw*e; pitch=camAnim.s.pitch+camAnim.tp*e;
    roll=camAnim.s.roll+camAnim.dRoll*e;
    if(k>=1)camAnim=null;
    applyCam();
  }
  drawCube();
}

/* ============ 主循环 ============ */
function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  for(const st of strings) st.line.material.resolution.set(innerWidth,innerHeight);
  fitView();                                           // 窗口变化→自动缩放适配
}
addEventListener("resize",resize); resize(); applyCam();
function frame(t){
  try{
  for(const st of strings){                              // 弦振动：两端固定的驻波
    const arr=new Float32Array((SEG+TAIL)*3);
    const dt=(t-st.lastPluck)/1000;
    const yTop=cm(STR_TOP), yBot=cm(STR_BOT);
    const decay=st.ring;                                 // 延音时间常数(秒)
    for(let i=0;i<SEG;i++){
      const f=i/(SEG-1), yy=yTop+(yBot-yTop)*f;
      // 一次模（主音）+ 二次/三次模（拨弦瞬间更明显，衰减更快）
      const m1=Math.exp(-dt*2.6), m2=Math.exp(-dt*7), m3=Math.exp(-dt*12);
      const off=st.amp*10*(
        Math.sin(Math.PI*f)*Math.sin(t*.02*st.note/261+st.phase)*m1+
        .45*Math.sin(2*Math.PI*f)*Math.sin(t*.04*st.note/261+st.phase*1.3)*m2+
        .25*Math.sin(3*Math.PI*f)*Math.sin(t*.06*st.note/261+st.phase*1.7)*m3);
      arr[i*3]=off; arr[i*3+1]=yy; arr[i*3+2]=STR_Z;
    }
    // 固定尾段：品条顶 → 面板穿孔 → 背面铁扣（不振动）
    const tailPts=[[yBot,STR_Z],[cm(3.1),TH/2+.45],[cm(2.5),TH/2+.05],[cm(2.5),RING_Z-.15]];
    let k=SEG;
    for(const [yy,zz] of tailPts){arr[k*3]=0;arr[k*3+1]=yy;arr[k*3+2]=zz;k++;}
    st.line.geometry.setPositions(arr);
  }
  stepCube(t);
  renderer.render(scene,camera);
  }catch(e){ window.__drawErr=(window.__drawErr||"")+e.stack+" | "; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
