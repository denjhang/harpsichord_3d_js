<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Manifold 内核验证 · 抽壳琴体</title>
<style>
  body{margin:0;overflow:hidden;font-family:monospace;background:#dfe1e4}
  #info{position:fixed;top:12px;left:14px;color:#333;font-size:13px;line-height:1.7;white-space:pre}
  #stl{position:fixed;top:12px;right:14px;padding:8px 18px;font-size:14px;cursor:pointer}
</style>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js",
            "three/addons/":"./node_modules/three/examples/jsm/",
            "manifold-3d":"./node_modules/manifold-3d/manifold.js"}}
</script>
</head>
<body>
<div id="info">loading manifold wasm…</div>
<button id="stl">导出 STL</button>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLExporter } from "three/addons/exporters/STLExporter.js";
import Module from "manifold-3d";

const info=document.getElementById("info");
const wasm=await Module(); wasm.setup();
const M=wasm.Manifold, {setMinCircularAngle}=wasm;
setMinCircularAngle(6);

/* —— 全部用 mm，与打印一致 ——
   琴体 240×160×20，壁厚 2.4，底面留实 2.4；
   正面开一个大圆音孔 + 7 个穿弦孔；顶上加一个品条实体 */
const WALL=2.4;
const outer=M.cube([240,160,20],true);
const inner=M.cube([240-2*WALL,160-2*WALL,20-2*WALL],true).translate([0,0,WALL]);
let body=outer.subtract(inner);
body=body.subtract(M.cylinder(60,25,25).translate([0,0,-30]));                    // 大圆音孔(竖直贯穿)
for(let i=-3;i<=3;i++)                                            // 7 个穿弦孔
  body=body.subtract(M.cylinder(60,2.2,2.2).translate([i*16,-62,-30]));
const bridge=M.cube([110,10,8],true).translate([0,-52,14]);       // 品条(与壳体布尔并)
body=body.add(bridge);

/* Manifold → three.js BufferGeometry（mm 单位，缩放到 cm 视图） */
const mesh=body.getMesh();
const g=new THREE.BufferGeometry();
g.setAttribute("position",new THREE.BufferAttribute(new Float32Array(mesh.vertProperties),3));
g.setIndex(Array.from(mesh.triVerts));
g.computeVertexNormals();
const obj=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xd9c49a,roughness:.7}));
obj.scale.setScalar(.1);                                          // mm→场景 cm

/* 场景 */
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xdfe1e4);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
cam.position.set(24,-24,34); cam.up.set(0,0,1); cam.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.7));
const key=new THREE.DirectionalLight(0xffffff,1.4); key.position.set(20,-15,30); scene.add(key);
const grid=new THREE.GridHelper(50,10); grid.rotation.x=Math.PI/2; scene.add(grid);
scene.add(obj);
new OrbitControls(cam,renderer.domElement);

info.textContent=
`Manifold 内核验证 ✅
status : ${body.status()}
genus  : ${body.genus()}（>0 = 有内腔，抽壳成功）
volume : ${body.volume().toFixed(0)} mm³（${(body.volume()/1000).toFixed(1)} cm³ 实心打印料）
tri    : ${mesh.triVerts.length/3}
壁厚   : ${WALL} mm | 全部水密，可直接切片`;

/* STL 导出（只导实体，几何已是水密实体） */
document.getElementById("stl").onclick=()=>{
  const txt=new STLExporter().parse(obj);
  const blob=new Blob([txt],{type:"model/stl"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="lyre_shell_test.stl"; a.click();
};
function loop(){ renderer.render(scene,cam); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
